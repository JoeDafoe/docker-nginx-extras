name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show build information
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== Working directory ==="
          pwd

          echo "=== Repository files ==="
          ls -la

          echo "=== Dockerfiles ==="
          find . -maxdepth 3 -type f -name 'Dockerfile*' -print

      - name: Validate Dockerfile
        run: |
          echo "=== Checking Dockerfile for HTML contamination ==="

          if grep -nE '<a |</a>|href=|ChatInputEntity|%7B|%7D' ./Dockerfile; then
            echo
            echo "ERROR: Dockerfile contains HTML/link markup."
            exit 1
          fi

          echo "No HTML contamination found."
          echo
          echo "=== URLs used by Dockerfile ==="
          grep -nE 'https?://' ./Dockerfile || true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            --file ./Dockerfile \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/docker-nginx-extras:latest" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/docker-nginx-extras:latest"
